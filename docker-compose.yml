# docker-compose.yml — run from repo root (Thesis/)
# Orchestrates: PostgreSQL, Redis, AI service
# Gateway runs locally (uvicorn) for hot-reload during dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eidovia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-eidovia}
    ports:
      - "${POSTGRES_PORT:-6543}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/ai/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./services/ai/migrations/002_events.sql:/docker-entrypoint-initdb.d/002_events.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-eidovia}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eidovia_network

  redis:
    image: redis:7-alpine
    container_name: eidovia_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eidovia_network

  ai-service:
    build:
      context: ./services/ai     # Dockerfile lives in services/ai/
      dockerfile: Dockerfile
    container_name: eidovia_ai
    restart: unless-stopped
    ports:
      - "${API_PORT:-8001}:8001"
    env_file:
      - .env                     # root .env — single source of truth
    environment:
      - DATABASE_HOST=postgres   # override to use Docker service name
      - DATABASE_PORT=5432       # inside docker network postgres listens on 5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eidovia_network

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: eidovia_gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - AI_SERVICE_URL=http://ai-service:8001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eidovia_network

volumes:
  pgdata:
  redisdata:

networks:
  eidovia_network:
    driver: bridge