# docker-compose.yml, run from repo root (Thesis/)
# Containers: PostgreSQL (pgvector), Redis, Ollama (Phi-4 mini + all-minilm)
# AI service and gateway run on the host with uvicorn (no Docker image needed)


services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eidovia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-eidovia}
    ports:
      - "${POSTGRES_PORT:-6543}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/ai/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./services/ai/migrations/002_events.sql:/docker-entrypoint-initdb.d/002_events.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-eidovia}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eidovia_network


  redis:
    image: redis:7-alpine
    container_name: eidovia_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eidovia_network


  ollama:
    image: ollama/ollama:latest
    container_name: eidovia_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
    # GPU access (needs NVIDIA drivers + Docker GPU support on the host).
    # Remove this block on a machine without an NVIDIA GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - eidovia_network


volumes:
  pgdata:
  redisdata:
  ollama_models:


networks:
  eidovia_network:
    driver: bridge