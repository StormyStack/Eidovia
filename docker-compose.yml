# docker-compose.yml, run from repo root (Thesis/)
# Containers: PostgreSQL (pgvector), Redis, Ollama (Phi-4 mini), and API Gateway

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eidovia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-eidovia}
    ports:
      - "${POSTGRES_PORT:-6543}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/ai/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./services/ai/migrations/002_events.sql:/docker-entrypoint-initdb.d/002_events.sql:ro
      - ./services/ai/migrations/003_hoe_levels.sql:/docker-entrypoint-initdb.d/003_hoe_levels.sql:ro
      - ./services/ai/migrations/004_audit_logs.sql:/docker-entrypoint-initdb.d/004_audit_logs.sql:ro
      - ./services/ai/migrations/005_admin_user.sql:/docker-entrypoint-initdb.d/005_admin_user.sql:ro
      - ./services/ai/migrations/006_admin_support_maintenance.sql:/docker-entrypoint-initdb.d/006_admin_support_maintenance.sql:ro
      - ./services/ai/migrations/007_wildcard_wallets.sql:/docker-entrypoint-initdb.d/007_wildcard_wallets.sql:ro
      - ./services/ai/migrations/008_support_ticket_kind.sql:/docker-entrypoint-initdb.d/008_support_ticket_kind.sql:ro
      - ./services/ai/migrations/009_user_profile.sql:/docker-entrypoint-initdb.d/009_user_profile.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-eidovia}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eidovia_network

  redis:
    image: redis:7-alpine
    container_name: eidovia_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eidovia_network

  ollama:
    image: ollama/ollama:latest
    container_name: eidovia_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - eidovia_network

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    image: thesis-gateway:latest
    container_name: eidovia_gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - OLLAMA_URL=http://ollama:11434
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./services/gateway/app:/app/app
      - ./services/gateway/scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eidovia_network

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    image: thesis-admin:latest
    container_name: eidovia_admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8090}:8090"
    env_file:
      - .env
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OLLAMA_URL=http://ollama:11434
      # Technical dashboard: the ngrok agent API (tunnel container) and the public domain to test
      - NGROK_API_URL=http://tunnel:4040
      - NGROK_DOMAIN=${NGROK_DOMAIN}
    volumes:
      - ./apps/admin:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eidovia_network

  logger:
    build:
      context: ./services/logger
      dockerfile: Dockerfile
    image: thesis-logger:latest
    container_name: eidovia_logger
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./services/logger:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eidovia_network

  # Public HTTPS address for the mobile app: ngrok with a fixed free domain.
  # Set NGROK_AUTHTOKEN and NGROK_DOMAIN in .env (dashboard.ngrok.com). The app uses https://<NGROK_DOMAIN>
  tunnel:
    image: ngrok/ngrok:latest
    container_name: eidovia_tunnel
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    # goes through the PC's published gateway port 8080 (GATEWAY_PORT)
    command: http --url=${NGROK_DOMAIN} host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - gateway
    networks:
      - eidovia_network

volumes:
  pgdata:
  redisdata:
  ollama_models:

networks:
  eidovia_network:
    driver: bridge